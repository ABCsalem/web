<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحديث الكاش - نظام التحضير</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      direction: rtl;
    }
    .container {
      background: white;
      padding: 40px 30px;
      border-radius: 24px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      color: #dc2626;
      margin-bottom: 10px;
    }
    p {
      color: #555;
      margin-bottom: 20px;
    }
    .btn {
      background: #2980b9;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover {
      background: #2471a3;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #f8f9fa;
      border: 1px solid #ddd;
      font-size: 0.95rem;
      display: none;
    }
    .status.success {
      border-color: #28a745;
      background: #d4edda;
      color: #155724;
    }
    .status.error {
      border-color: #dc3545;
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 تحديث الكاش</h1>
    <p>هذه الصفحة تقوم بتحديث الملفات المخزنة مؤقتاً (الكاش) إلى أحدث إصدار،<br>مع الحفاظ على بياناتك المخزنة (الموظفين، الإعدادات).</p>
    <button id="updateBtn" class="btn">بدء التحديث</button>
    <div id="statusMessage" class="status"></div>
  </div>

  <script>
    document.getElementById('updateBtn').addEventListener('click', async function() {
      const btn = this;
      const statusDiv = document.getElementById('statusMessage');
      btn.disabled = true;
      btn.textContent = 'جاري التحديث...';
      statusDiv.style.display = 'block';
      statusDiv.className = 'status';
      statusDiv.textContent = 'جاري مسح الكاش القديم...';

      try {
        // 1. حذف جميع الكاشات القديمة
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
          console.log('تم مسح الكاش القديم');
          statusDiv.textContent = '✅ تم مسح الكاش القديم. جاري تحميل الإصدار الجديد...';
        }

        // 2. إلغاء تسجيل Service Worker الحالي
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(reg => reg.unregister()));
          console.log('تم إلغاء تسجيل Service Worker القديم');
          statusDiv.textContent = '✅ تم إلغاء تسجيل Service Worker القديم. جاري التسجيل الجديد...';
        }

        // 3. تسجيل Service Worker الجديد (سيقوم بتحميل الملفات الجديدة)
        if ('serviceWorker' in navigator) {
          const registration = await navigator.serviceWorker.register('/web/sw.js');
          console.log('تم تسجيل Service Worker الجديد:', registration);
          statusDiv.textContent = '✅ تم تسجيل Service Worker الجديد. جاري التفعيل...';

          // انتظار التفعيل
          if (registration.active) {
            // السيطرة على العملاء
            await registration.update();
          }
          
          // انتظار قليلاً للتأكد من التفعيل
          await new Promise(resolve => setTimeout(resolve, 1000));
        }

        // 4. إعادة تحميل الصفحة الرئيسية بعد نجاح التحديث
        statusDiv.className = 'status success';
        statusDiv.textContent = '✅ تم تحديث الكاش بنجاح! سيتم توجيهك إلى الصفحة الرئيسية...';
        
        setTimeout(() => {
          window.location.href = '/web/index.html';
        }, 2000);

      } catch (error) {
        console.error('فشل التحديث:', error);
        statusDiv.className = 'status error';
        statusDiv.textContent = '❌ فشل التحديث: ' + error.message;
        btn.disabled = false;
        btn.textContent = 'إعادة المحاولة';
      }
    });
  </script>
</body>
</html>
