<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>نظام إدارة وأتمتة التحضير - م/سالم صلاح</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="header-actions">
      <div>
        <h1>نظام إدارة وأتمتة التحضير</h1>
        <div class="developer">مطور النظام: م/سالم صلاح</div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button id="reset-btn" class="btn-reset">🗑️ مسح</button>
        <button id="export-btn" class="btn-export">📥 تصدير Excel</button>
      </div>
    </div>

    <div class="table-section">
      <h2>تعبئة أعداد المقاتلين والموظفين</h2>
      <table id="stats-table">
        <thead>
          <tr>
            <th>الرتبة</th><th>الملاك</th><th>المعسكر</th><th>موقع</th><th>إجازة</th><th>مستشفى</th><th>مهمة</th><th>مكلف</th><th>مستأذن</th><th>دورة</th><th>مرافقين</th><th>متأخر</th><th>غياب</th><th>سجن</th><th>اسرى</th><th>شهداء</th><th>جرحى</th><th>إعاقة</th><th>الهروب</th>
          </tr>
        </thead>
        <tbody>
          <tr id="row-officers"><td class="row-title">ضباط</td><td><input type="number" class="quota-input" value="10" min="0"></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td><td><span class="stat-val">0</span></td></tr>
          <tr id="row-soldiers"><td class="row-title">أفراد مقاتلين</td><td><input type="number" class="quota-input" value="170" min="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td></tr>
          <tr id="row-employees"><td class="row-title">موظف</td><td><input type="number" class="quota-input" value="170" min="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td><td><input type="number" class="stat-input" value="0"></td></tr>
        </tbody>
      </table>
    </div>

    <div class="table-section">
      <div class="table-header-actions">
        <h2>تحديث حالات الموظفين</h2>
        <button id="add-person-btn" class="btn-add">➕ إضافة موظف</button>
      </div>
      <table id="personnel-table"><thead><tr><th>#</th><th>الاسم</th><th>النقطة</th><th>الوظيفة</th><th>الحالة</th><th>حذف</th></tr></thead><tbody></tbody></table>
    </div>
  </div>

  <!-- مودال الإضافة -->
  <div id="add-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3>➕ إضافة موظف جديد</h3>
      <div class="modal-form">
        <div class="form-group"><label>الاسم:</label><input type="text" id="new-name" placeholder="أدخل الاسم"></div>
        <div class="form-group"><label>النقطة:</label><input type="text" id="new-point" placeholder="أدخل النقطة"></div>
        <div class="form-group"><label>الوظيفة:</label><input type="text" id="new-job" placeholder="أدخل الوظيفة"></div>
        <div class="modal-actions"><button id="modal-cancel" class="btn-cancel">إلغاء</button><button id="modal-save" class="btn-save">حفظ وإضافة</button></div>
      </div>
    </div>
  </div>

  <!-- تسجيل الـ Service Worker (تم تحسينه) -->
  <script>
    if ('serviceWorker' in navigator) {
      // حذف الـ Cache القديم عند التحديث لمنع التعليق
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>

  <script src="renderer.js"></script>
</body>
</html>
